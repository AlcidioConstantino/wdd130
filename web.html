<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Form</title>
</head>
<body>

    <header>
        <h1>Poll Form</h1>
    </header>

    <main>
        <form>

            <div>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required>
            </div>

            <br>

            <div>
                <label for="username">Username:</label><br>
                <input type="text" id="username" name="username" required>
            </div>

            <br>

            <div>
                <label for="useremail">Email Address:</label><br>
                <input type="email" id="useremail" name="useremail" required>
            </div>

            <br>

            <div>
                <label for="browser">What is your favorite browser?</label><br>
                <select id="browser" name="browser">
                    <option value="chrome">Chrome</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <br>

            <div>
                <label for="pet">
                    <input type="checkbox" id="pet" name="pet">
                    Do you have a household pet?
                </label>
            </div>

            <br>

            <div>
                <label for="feedback">List the places you have lived.</label><br>
                <textarea
                    id="feedback"
                    name="feedback"
                    rows="5"
                    placeholder="List the places you have lived..."></textarea>
            </div>

            <br>

            <button type="submit">Submit Poll</button>

        </form>
    </main>

    <footer>
        <p>&copy; 2026 | WDD 130 | Poll Form</p>
    </footer>

</body>
</html>
